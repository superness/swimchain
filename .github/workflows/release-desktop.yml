name: Release Desktop

# Builds (and, once signing secrets exist, signs) the Windows desktop bundle.
#
# Until 2026-08-03 every desktop release was hand-built on a developer machine
# and shipped UNSIGNED. Windows Defender's ML classifier then flagged the
# bundled sidecar as Trojan:Win32/Bearfoos.B!ml and DELETED it post-install,
# leaving an app that launched into a silent do-nothing state. Building here
# makes releases reproducible and gives signing one place to live.
#
# Signing order matters: `sw.exe` is signed BEFORE build.sh stages it into the
# bundle. Signing only the installer leaves the extracted sidecar unsigned,
# which is the exact file Defender removed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.17 (no leading v)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release (otherwise just upload artifacts)"
        required: false
        default: false
        type: boolean
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write
  id-token: write # OIDC for Trusted Signing — keeps keys off the runner

env:
  CARGO_TERM_COLOR: always
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  build:
    name: Build Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The bundle version comes from tauri.conf.json, NOT from the dispatch
      # input. Before this, `version=0.1.17` produced Swimchain_0.1.16 artifacts
      # and would have published them under a desktop-v0.1.17-alpha tag — a
      # release whose name disagrees with its contents, which makes "which build
      # is this?" unanswerable after the fact.
      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#desktop-v}"   # desktop-v0.1.17-alpha -> 0.1.17-alpha
            v="${v%%-*}"                       # drop any pre-release suffix -> 0.1.17
          else
            v="${{ inputs.version }}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not resolve a semver version (got '$v'). Tags must look like desktop-v1.2.3-alpha."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      # Stamp all three sources together. They are separate files that must
      # agree — the installer filename comes from tauri.conf.json, the exe
      # metadata from Cargo.toml, and npm tooling reads package.json. #272 was
      # a manual cleanup of exactly that drift; stamping them from one value
      # makes the drift impossible in a CI build.
      - name: Stamp the version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"

          $tauriPath = 'desktop-app/src-tauri/tauri.conf.json'
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = $v
          $tauri | ConvertTo-Json -Depth 20 | Set-Content $tauriPath -Encoding utf8

          $pkgPath = 'desktop-app/package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $v
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding utf8

          # Only the [package] version — a blunt replace would rewrite
          # dependency versions further down the file.
          $cargoPath = 'desktop-app/src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $patched = [regex]::Replace(
            $cargo,
            '(?ms)(^\[package\].*?^version\s*=\s*")[^"]*(")',
            "`${1}$v`${2}",
            1)
          if ($patched -eq $cargo) { throw "Cargo.toml [package] version was not rewritten" }
          Set-Content $cargoPath -Value $patched -Encoding utf8 -NoNewline

          Write-Host "stamped $v into tauri.conf.json, package.json, Cargo.toml"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-cargo-

      # aws-lc-sys / ring need NASM on Windows; the local builder warns when
      # it is missing and the sw.exe build fails without it.
      - name: Install NASM
        run: choco install nasm --no-progress -y

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build the node binary
        run: cargo build --release --bin sw

      # A step's own `env:` block is not in scope for that step's `if:`, and the
      # `secrets` context is not available there either — so resolve it once
      # here and gate the signing steps on this output.
      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -n "$TENANT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets configured — this build will ship UNSIGNED binaries that Windows Defender may delete."
          fi

      # ---- Signing the sidecar, BEFORE it gets bundled ----
      # Inert until the Trusted Signing secrets are configured; the bundle still
      # builds without them so this workflow is useful from day one.
      - name: Sign sw.exe
        id: sign_sidecar
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Stage the SIGNED sidecar ourselves rather than letting the build script
      # rebuild it. build.ps1's Step 1 runs `cargo build` and copies the result;
      # if cargo decides to relink, it would overwrite the signature we just
      # applied and ship an unsigned sidecar that still looks fine. -SkipNode
      # skips both the build and that copy, so we do the copy here.
      - name: Stage the signed sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-app/src-tauri/binaries | Out-Null
          Copy-Item target/release/sw.exe desktop-app/src-tauri/binaries/sw.exe -Force
          $sig = Get-AuthenticodeSignature desktop-app/src-tauri/binaries/sw.exe
          Write-Host "staged sidecar signature: $($sig.Status)"

      # build.ps1, NOT build.sh. build.sh stops at 8 steps and never builds the
      # launcher apps, so `src-tauri/apps/` (gitignored) stays empty and Tauri
      # fails with "resource path `apps` doesn't exist" on any clean checkout.
      # build.ps1 Step 7 builds app-shell against each client and stages them.
      # -SkipTauri: stop before packaging so the launcher app exes staged in
      # Step 7 can be signed first. They land on users' disks, so an unsigned
      # one is exactly what Defender deleted.
      - name: Build desktop bundle (stop before packaging)
        shell: pwsh
        run: ./desktop-app/build.ps1 -SkipNode -SkipTauri

      # build.ps1 sets $ErrorActionPreference = "Continue" and reports failures
      # as warnings, so it can exit 0 having produced nothing. Assert the things
      # that must exist rather than trusting the exit code.
      - name: Verify launcher apps were staged
        shell: pwsh
        run: |
          $appsDir = "desktop-app/src-tauri/apps"
          if (-not (Test-Path $appsDir)) { throw "apps/ was not created - launcher apps did not build" }
          $apps = Get-ChildItem $appsDir -Directory
          if ($apps.Count -eq 0) { throw "apps/ is empty - launcher apps did not build" }
          foreach ($a in $apps) {
            $exe = Get-ChildItem $a.FullName -Filter "*-app.exe" -ErrorAction SilentlyContinue
            if (-not $exe) { throw "$($a.Name): no *-app.exe staged" }
            Write-Host ("{0,-10} {1,12:N0} bytes" -f $a.Name, $exe[0].Length)
          }
          Write-Host "$($apps.Count) launcher apps staged"

      # Sign the launcher app exes BEFORE Tauri packages them into the bundle.
      - name: Sign launcher apps
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/desktop-app/src-tauri/apps
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Everything bundled is now signed, so package.
      - name: Package the Tauri bundle
        shell: pwsh
        working-directory: desktop-app
        run: npx tauri build

      - name: Sign the installer and shell
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/desktop-app/src-tauri/target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Provenance the hand-built releases never had: publish the hashes so a
      # user (or a future debugging session) can verify what actually shipped.
      - name: Report artifact hashes and signature status
        shell: bash
        run: |
          echo "### Desktop bundle artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find desktop-app/src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \) -print0 |
            while IFS= read -r -d '' f; do
              echo "$(sha256sum "$f")"
            done >> "$GITHUB_STEP_SUMMARY"
          sha256sum target/release/sw.exe >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Every executable that reaches a user's disk must be signed, not just the
      # installer. Defender deleted the extracted sidecar, not the installer.
      - name: Verify everything bundled is signed
        shell: pwsh
        continue-on-error: true
        run: |
          $targets = @('desktop-app/src-tauri/binaries/sw.exe')
          $targets += (Get-ChildItem desktop-app/src-tauri/apps -Recurse -Filter *.exe -ErrorAction SilentlyContinue).FullName
          $unsigned = @()
          foreach ($t in $targets) {
            $s = (Get-AuthenticodeSignature $t).Status
            "{0,-12} {1}" -f $s, (Split-Path $t -Leaf)
            if ($s -ne 'Valid') { $unsigned += $t }
          }
          if ($unsigned.Count -gt 0) {
            Write-Warning "$($unsigned.Count) bundled executable(s) NOT signed - Defender may delete them on user machines:"
            $unsigned | ForEach-Object { Write-Warning "  $_" }
          } else {
            Write-Host "all $($targets.Count) bundled executables signed"
          }

      # Close the loop: the artifacts must actually carry the version we were
      # asked to build. Stamping without checking would just move the mismatch.
      - name: Verify artifacts carry the requested version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $files = Get-ChildItem desktop-app/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi
          if (-not $files) { throw "no installer artifacts were produced" }
          $bad = $files | Where-Object { $_.Name -notlike "*$v*" }
          $files | ForEach-Object { "  $($_.Name)" }
          if ($bad) {
            throw "artifact name does not contain version ${v}: $($bad.Name -join ', ')"
          }
          Write-Host "all $($files.Count) artifacts carry version $v"

      - uses: actions/upload-artifact@v4
        with:
          name: swimchain-desktop-windows
          path: |
            desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            desktop-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('desktop-v{0}-alpha', steps.ver.outputs.version) }}
          prerelease: true
          files: |
            desktop-app/src-tauri/target/release/bundle/nsis/*.exe
            desktop-app/src-tauri/target/release/bundle/msi/*.msi
