name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Dependency-free: reads tracked files + greps configs, no `npm install`.
  # That is what lets it gate every client on every push, not just the ones
  # that can currently build in CI (see the `clients` job comment below).
  bundle-size-gate:
    name: Bundle size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check sourcemaps, tracked maps, and bundle sizes
        run: bash scripts/check-bundle-sizes.sh

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Allow existing style warnings, deny actual errors
        run: cargo clippy --all-targets --all-features -- -A clippy::unreadable_literal -A clippy::similar_names -A clippy::redundant_else -W clippy::all

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets

  # THE CLIENTS WERE NEVER TESTED BY ANYTHING. chips-client had 38 test suites
  # and no workflow mentioned it, so they ran exactly when somebody remembered
  # to — which, for the six added on 2026-07-28, was never: `npm test` was a
  # hand-written chain of 32 files and the newest six were not in it.
  #
  # Separate job, not a step on `check`: a Rust clippy failure must not hide
  # whether the game logic is sound, and vice versa. They fail independently
  # because they are independent.
  clients:
    name: Client tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # chips-client ONLY for now. reef-client has no package-lock.json, so
        # `npm ci` cannot run there, and a job that is red the day it lands is
        # worse than no job — that is precisely how the Rust CI ended up
        # unread for 19 runs. Commit a lockfile for reef and add it here; its
        # `test` script is also a hand-written chain of 2 files against 4 on
        # disk, so it wants the same glob runner first.
        client: [chips-client]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.client }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.client }}
        run: npx tsc -b

      - name: Test
        working-directory: ${{ matrix.client }}
        run: npm test

      # chips-client is the one client in this matrix that actually builds in
      # CI (reef-client has no lockfile yet, see the matrix comment above), so
      # it is the one that gets a TRUE post-build size gate instead of the
      # committed-bytes check in scripts/check-bundle-sizes.sh.
      - name: Build (chips-client)
        if: matrix.client == 'chips-client'
        working-directory: ${{ matrix.client }}
        run: npm run build

      - name: Check bundle size (gzipped, chips-client)
        if: matrix.client == 'chips-client'
        working-directory: ${{ matrix.client }}
        run: |
          BUNDLE_SIZE_LIMIT=170000 # ~30% above 130065B measured 2026-08-01

          FILES=$(find dist/assets -maxdepth 1 -name 'index-*.js')
          if [ -z "$FILES" ]; then
            echo "ERROR: no dist/assets/index-*.js found — did the build step run?"
            exit 1
          fi

          for f in $FILES; do
            RAW_SIZE=$(stat -c %s "$f")
            GZIP_SIZE=$(gzip -c "$f" | wc -c)

            echo "$f:"
            echo "  Raw:     $(numfmt --to=iec-i --suffix=B "$RAW_SIZE")"
            echo "  Gzipped: $(numfmt --to=iec-i --suffix=B "$GZIP_SIZE")"
            echo "  Limit:   $(numfmt --to=iec-i --suffix=B "$BUNDLE_SIZE_LIMIT")"

            if [ "$GZIP_SIZE" -gt "$BUNDLE_SIZE_LIMIT" ]; then
              echo ""
              echo "ERROR: $f is $GZIP_SIZE bytes gzipped, exceeds limit of $BUNDLE_SIZE_LIMIT bytes"
              exit 1
            fi
          done

          echo ""
          echo "Bundle size check passed!"
