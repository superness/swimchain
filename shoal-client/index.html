<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Shoal — a sea you share with strangers, where safety is the crowd." />
    <title>The Shoal</title>
    <!--
      NOTHING INLINE MAY GO IN THIS FILE. Not a `<style>` block, not a
      `<script>` body. Tauri stamps a nonce on each one it finds here and
      appends the matching source to the CSP directive, which per CSP3 makes
      `'unsafe-inline'` ignored for the whole page — and that is how a
      three-line reset that used to sit right here silently unstyled
      `TheEdge`'s runtime `<style>` element in a shipped build. The reset now
      lives in `src/ui/shell.css`, linked by Vite. `shippedStyles.test.ts`
      fails if an inline element ever comes back.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
